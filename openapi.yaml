openapi: 3.0.3
info:
  title: DapurKita API
  version: 2.4.0
  description: |
    Kontrak REST API DapurKita, berawal dari DapurKita_API_Handoff_v2.3.pdf, dengan perubahan v2.3.1 dan v2.4.0 di bawah.
    Status: disetujui PM. Sejak v2.3, file ini menjadi acuan integrasi.

    Changelog v2.4.0 (fitur disetujui PM, 24 November 2026; semua perubahan bersifat menambah):
    - Artikel: `GET/POST /articles`, `GET/PUT/DELETE /articles/{id}`, `GET /articles/facets`.
    - Komentar resep dengan satu tingkat balasan: `GET/POST /recipes/{id}/comments`, `DELETE /comments/{id}`.
    - Ulasan dan rating 1-5, satu per user per resep: `GET /recipes/{id}/reviews`,
      `GET/PUT/DELETE /recipes/{id}/reviews/me`, `DELETE /reviews/{id}` (ADMIN), `GET /reviews/featured`.
    - Upload foto (ADMIN): `POST /images`, dan foto dilayani lewat `GET /images/{name}`.
    - `RecipeSummary` dan `RecipeDetail` mendapat field `ratingAverage` dan `ratingCount`.
    - `imageUrl` resep dan `coverImageUrl` artikel menerima URL http/https atau path hasil upload `/api/v1/images/...`.

    Konvensi: base path `/api/v1`, JSON camelCase, tanggal ISO-8601 UTC, field nullable
    selalu dikirim eksplisit sebagai `null`, pagination `page` mulai dari 1.
    Cabangkan logika error berdasarkan `code`, bukan `message`.

    Changelog v2.3.1 (disetujui PM): pencocokan parameter `ingredient` berubah dari substring
    menjadi pencocokan di awal kata, agar "ayam" tidak cocok dengan "bayam". Hanya deskripsi
    yang berubah; endpoint, field, dan struktur response tidak berubah.
servers:
  - url: /api/v1
    description: Same-origin lewat reverse proxy (dev memakai Vite proxy ke http://localhost:8080)
tags:
  - name: Auth
  - name: User
  - name: Category
  - name: Recipe
  - name: Favorite
  - name: Article
  - name: Comment
  - name: Review
  - name: Image

paths:
  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Registrasi user baru (role selalu USER)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
            example: { name: Siti, email: siti@mail.com, password: rahasia123 }
      responses:
        '201':
          description: Terdaftar dan langsung login. Refresh token dikirim sebagai cookie HttpOnly.
          headers:
            Set-Cookie: { $ref: '#/components/headers/RefreshCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: Email sudah terdaftar (`EMAIL_ALREADY_EXISTS`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                status: 409
                code: EMAIL_ALREADY_EXISTS
                message: Email sudah terdaftar
                path: /api/v1/auth/register
                timestamp: '2026-11-03T08:00:00Z'
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example: { email: siti@mail.com, password: rahasia123 }
      responses:
        '200':
          description: Berhasil. Refresh token dikirim sebagai cookie HttpOnly.
          headers:
            Set-Cookie: { $ref: '#/components/headers/RefreshCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          description: Email atau password salah (`INVALID_CREDENTIALS`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                status: 401
                code: INVALID_CREDENTIALS
                message: Email atau password salah
                path: /api/v1/auth/login
                timestamp: '2026-11-03T08:00:00Z'
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: Tukar refresh token (cookie) dengan access token baru
      description: |
        Tanpa body. Cookie `refreshToken` terkirim otomatis (wajib `withCredentials`).
        Refresh token berotasi: token lama dicabut dan cookie baru dikirim.
        401 saat aplikasi dimuat berarti user anonim, bukan error.
      security:
        - refreshCookie: []
      responses:
        '200':
          description: Access token baru dan cookie refresh baru
          headers:
            Set-Cookie: { $ref: '#/components/headers/RefreshCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Cabut refresh token dan hapus cookie
      security:
        - refreshCookie: []
      responses:
        '204':
          description: Berhasil, cookie dihapus
        '500': { $ref: '#/components/responses/InternalError' }

  /users/me:
    get:
      tags: [User]
      operationId: getMe
      summary: Profil sendiri
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [User]
      operationId: updateMe
      summary: Ubah nama profil
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
            example: { name: Siti Aminah }
      responses:
        '200':
          description: Profil terbaru
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /users/me/favorites:
    get:
      tags: [User]
      operationId: listMyFavorites
      summary: Koleksi resep favorit sendiri
      description: Item berupa RecipeSummary dengan `isFavorited` selalu `true`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Halaman favorit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecipePage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /categories:
    get:
      tags: [Category]
      operationId: listCategories
      summary: Daftar kategori (seed data)
      description: Array biasa tanpa pagination. Tidak ada endpoint tambah, ubah, atau hapus.
      security: []
      responses:
        '200':
          description: Daftar kategori
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }
              example:
                - { id: 1, name: Makanan Utama, slug: makanan-utama }
                - { id: 2, name: Lauk, slug: lauk }
        '500': { $ref: '#/components/responses/InternalError' }

  /recipes:
    get:
      tags: [Recipe]
      operationId: listRecipes
      summary: Cari dan daftar resep
      description: |
        Publik. Jika header Authorization dikirim, `isFavorited` terisi sesuai user.
        Tanpa token, `isFavorited` bernilai `false`.
        Parameter `ingredient` boleh diulang dengan logika AND (semua bahan harus cocok).
        Pencocokan bahan di awal kata, tanpa membedakan huruf besar/kecil: `ayam` cocok dengan
        "Daging ayam" dan "Ayam kampung", tetapi tidak dengan "Bayam"; `sant` cocok dengan "Santan".
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          description: Kata kunci judul
          schema: { type: string }
        - name: categoryId
          in: query
          description: Filter satu kategori
          schema: { type: integer, format: int64 }
        - name: ingredient
          in: query
          description: Nama bahan. Ulangi parameter untuk beberapa bahan (AND).
          style: form
          explode: true
          schema:
            type: array
            items: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Halaman resep. Hasil kosong tetap 200 dengan `content` kosong.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecipePage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Recipe]
      operationId: createRecipe
      summary: Buat resep (ADMIN)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecipeRequest' }
            example:
              title: Rendang Sapi
              description: Rendang khas Minang
              imageUrl: https://example.com/rendang.jpg
              cookingTimeMinutes: 180
              servings: 6
              categoryId: 2
              ingredients:
                - { name: Daging sapi, quantity: '1', unit: kg }
                - { name: Garam, quantity: secukupnya, unit: null }
              instructions:
                - { description: Haluskan bumbu. }
                - { description: Masak hingga santan menyusut. }
      responses:
        '201':
          description: Resep dibuat
          headers:
            Location:
              description: URL resep, contoh `/api/v1/recipes/12`
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecipeDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /recipes/{id}:
    parameters:
      - $ref: '#/components/parameters/RecipeId'
    get:
      tags: [Recipe]
      operationId: getRecipe
      summary: Detail resep
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: Detail resep
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecipeDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [Recipe]
      operationId: updateRecipe
      summary: Ubah resep, replace penuh (ADMIN)
      description: Menggantikan seluruh isi resep, termasuk ingredients dan instructions.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecipeRequest' }
      responses:
        '200':
          description: Resep terbaru
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecipeDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Recipe]
      operationId: deleteRecipe
      summary: Hapus resep (ADMIN)
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Terhapus
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /recipes/{id}/favorite:
    parameters:
      - $ref: '#/components/parameters/RecipeId'
    put:
      tags: [Favorite]
      operationId: addFavorite
      summary: Tambah ke favorit (idempoten)
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Berhasil, juga jika sudah favorit
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Favorite]
      operationId: removeFavorite
      summary: Hapus dari favorit (idempoten)
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Berhasil, juga jika belum favorit
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /recipes/{id}/comments:
    parameters:
      - $ref: '#/components/parameters/RecipeId'
    get:
      tags: [Comment]
      operationId: listRecipeComments
      summary: Komentar resep (publik)
      description: |
        Halaman berisi komentar utama, terbaru lebih dulu. Setiap komentar utama membawa semua balasannya
        di `replies`, terlama lebih dulu. `totalElements` menghitung komentar utama saja, sedangkan
        `totalComments` menghitung komentar utama beserta balasan.
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Halaman komentar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommentPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Comment]
      operationId: createRecipeComment
      summary: Tulis komentar atau balasan (USER/ADMIN)
      description: |
        `parentId` diisi untuk membalas. Induknya harus komentar utama pada resep yang sama;
        jika tidak, `400 VALIDATION_ERROR` dengan field `parentId`. Balasan tidak bisa dibalas lagi.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommentRequest' }
            example: { content: Sudah saya coba, enak sekali!, parentId: null }
      responses:
        '201':
          description: Komentar dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /comments/{id}:
    parameters:
      - $ref: '#/components/parameters/CommentId'
    delete:
      tags: [Comment]
      operationId: deleteComment
      summary: Hapus komentar (pemilik atau ADMIN)
      description: Menghapus komentar utama ikut menghapus semua balasannya.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Terhapus
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /recipes/{id}/reviews:
    parameters:
      - $ref: '#/components/parameters/RecipeId'
    get:
      tags: [Review]
      operationId: listRecipeReviews
      summary: Ulasan resep (publik), terbaru lebih dulu
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Halaman ulasan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /recipes/{id}/reviews/me:
    parameters:
      - $ref: '#/components/parameters/RecipeId'
    get:
      tags: [Review]
      operationId: getMyReview
      summary: Ulasan milik user untuk resep ini
      description: '`404 NOT_FOUND` jika user belum mengulas resep ini, atau resep tidak ada.'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Ulasan user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [Review]
      operationId: upsertMyReview
      summary: Beri atau ubah ulasan (satu per user per resep)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewRequest' }
            example: { rating: 5, content: Bumbunya meresap sempurna. }
      responses:
        '200':
          description: Ulasan tersimpan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Review]
      operationId: deleteMyReview
      summary: Hapus ulasan sendiri (idempoten)
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Terhapus, juga jika belum pernah mengulas
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /reviews/{id}:
    parameters:
      - $ref: '#/components/parameters/ReviewId'
    delete:
      tags: [Review]
      operationId: deleteReview
      summary: Hapus ulasan siapa pun (ADMIN, moderasi)
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Terhapus
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /reviews/featured:
    get:
      tags: [Review]
      operationId: listFeaturedReviews
      summary: Ulasan unggulan untuk beranda (publik)
      description: Ulasan dengan rating minimal 4 dan berisi teks, terbaru lebih dulu. Array biasa tanpa pagination.
      security: []
      parameters:
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 10, default: 5 }
      responses:
        '200':
          description: Daftar ulasan unggulan
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FeaturedReview' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /articles:
    get:
      tags: [Article]
      operationId: listArticles
      summary: Daftar artikel (publik), terbaru lebih dulu
      security: []
      parameters:
        - name: q
          in: query
          description: Kata kunci judul, tanpa membedakan huruf besar/kecil
          schema: { type: string }
        - name: category
          in: query
          schema: { $ref: '#/components/schemas/ArticleCategory' }
        - name: tag
          in: query
          description: Satu tag, cocok persis tanpa membedakan huruf besar/kecil
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Halaman artikel. Hasil kosong tetap 200 dengan `content` kosong.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArticlePage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Article]
      operationId: createArticle
      summary: Tulis artikel (ADMIN)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArticleRequest' }
      responses:
        '201':
          description: Artikel dibuat
          headers:
            Location:
              description: URL artikel, contoh `/api/v1/articles/3`
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArticleDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /articles/facets:
    get:
      tags: [Article]
      operationId: getArticleFacets
      summary: Jumlah artikel per kategori dan tag terpopuler (publik)
      description: Kategori tanpa artikel tetap dikirim dengan `count` 0. Maksimal 20 tag, terbanyak lebih dulu.
      security: []
      responses:
        '200':
          description: Faset artikel
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArticleFacets' }
        '500': { $ref: '#/components/responses/InternalError' }

  /articles/{id}:
    parameters:
      - $ref: '#/components/parameters/ArticleId'
    get:
      tags: [Article]
      operationId: getArticle
      summary: Detail artikel (publik)
      security: []
      responses:
        '200':
          description: Detail artikel
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArticleDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [Article]
      operationId: updateArticle
      summary: Ubah artikel, replace penuh (ADMIN)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArticleRequest' }
      responses:
        '200':
          description: Artikel terbaru
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArticleDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Article]
      operationId: deleteArticle
      summary: Hapus artikel (ADMIN)
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Terhapus
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /images:
    post:
      tags: [Image]
      operationId: uploadImage
      summary: Unggah foto (ADMIN)
      description: |
        JPEG, PNG, atau WebP, maksimal 5 MB. Jenis file diperiksa dari isinya, bukan dari nama.
        File yang ditolak menghasilkan `400 VALIDATION_ERROR` dengan field `file`.
        URL hasil dipakai sebagai `imageUrl` resep atau `coverImageUrl` artikel.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Foto tersimpan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImageUpload' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /images/{name}:
    get:
      tags: [Image]
      operationId: getImage
      summary: Ambil foto hasil upload (publik)
      description: Nama file acak dan tidak pernah berubah isinya, jadi boleh di-cache lama (`immutable`).
      security: []
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string, pattern: '^[a-f0-9]{32}\.(jpg|png|webp)$' }
      responses:
        '200':
          description: Isi foto
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token JWT, berlaku 15 menit. Simpan di memori, bukan localStorage.
    refreshCookie:
      type: apiKey
      in: cookie
      name: refreshToken
      description: Cookie HttpOnly, SameSite=Strict, Path=/api/v1/auth, berlaku 7 hari.

  headers:
    RefreshCookie:
      description: >-
        `refreshToken=...; HttpOnly; Secure (production); SameSite=Strict; Path=/api/v1/auth; Max-Age=604800`
      schema: { type: string }

  parameters:
    Page:
      name: page
      in: query
      description: Nomor halaman, mulai dari 1
      schema: { type: integer, minimum: 1, default: 1 }
    Size:
      name: size
      in: query
      description: Jumlah item per halaman
      schema: { type: integer, minimum: 1, maximum: 50, default: 12 }
    Sort:
      name: sort
      in: query
      schema:
        type: string
        enum: [newest, oldest, title]
        default: newest
    RecipeId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ArticleId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    CommentId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ReviewId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }

  responses:
    ValidationError:
      description: |
        Input tidak valid (`VALIDATION_ERROR`) atau JSON rusak (`MALFORMED_REQUEST`).
        Termasuk `categoryId` yang tidak ada (`field: categoryId`) dan parameter query di luar batas
        (`page` kurang dari 1, `size` di luar 1 sampai 50, `sort` tidak dikenal), dengan `field` berisi
        nama parameter. Backend tidak membulatkan nilai diam-diam.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            status: 400
            code: VALIDATION_ERROR
            message: Data tidak valid
            errors:
              - { field: title, message: Judul wajib diisi }
            path: /api/v1/recipes
            timestamp: '2026-11-03T08:00:00Z'
    Unauthorized:
      description: |
        `TOKEN_EXPIRED` (picu refresh satu kali) atau `UNAUTHORIZED` (akhiri sesi, tanpa refresh).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            status: 401
            code: TOKEN_EXPIRED
            message: Token kedaluwarsa
            path: /api/v1/users/me
            timestamp: '2026-11-03T08:00:00Z'
    Forbidden:
      description: Role tidak cukup, misalnya USER memanggil endpoint ADMIN (`FORBIDDEN`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            status: 403
            code: FORBIDDEN
            message: Akses ditolak
            path: /api/v1/recipes
            timestamp: '2026-11-03T08:00:00Z'
    NotFound:
      description: Resource tidak ada (`NOT_FOUND`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            status: 404
            code: NOT_FOUND
            message: Resep tidak ditemukan
            path: /api/v1/recipes/999
            timestamp: '2026-11-03T08:00:00Z'
    TooManyRequests:
      description: Kena rate limit (`TOO_MANY_REQUESTS`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InternalError:
      description: Kesalahan server (`INTERNAL_ERROR`), tanpa stack trace
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    ErrorResponse:
      type: object
      required: [status, code, message, path, timestamp]
      properties:
        status: { type: integer, example: 400 }
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - MALFORMED_REQUEST
            - INVALID_CREDENTIALS
            - TOKEN_EXPIRED
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - EMAIL_ALREADY_EXISTS
            - TOO_MANY_REQUESTS
            - INTERNAL_ERROR
        message: { type: string }
        errors:
          type: array
          description: Hanya muncul pada `VALIDATION_ERROR`
          items: { $ref: '#/components/schemas/FieldError' }
        path: { type: string }
        timestamp: { type: string, format: date-time }

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: |
            Nama field. Field bersarang memakai notasi indeks berkurung dengan indeks mulai dari 0
            sesuai urutan array yang dikirim.
          example: 'ingredients[0].name'
        message: { type: string }

    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 2, maxLength: 100, description: Di-trim }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 8, maxLength: 72 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string }

    UpdateProfileRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 100, description: Di-trim }

    User:
      type: object
      required: [id, name, email, role]
      properties:
        id: { type: integer, format: int64, example: 1 }
        name: { type: string, example: Siti }
        email: { type: string, format: email, example: siti@mail.com }
        role: { type: string, enum: [USER, ADMIN] }

    AuthResponse:
      type: object
      description: Refresh token tidak ada di body, dikirim lewat cookie HttpOnly.
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken: { type: string, example: eyJ... }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn: { type: integer, description: Detik, example: 900 }
        user: { $ref: '#/components/schemas/User' }

    Category:
      type: object
      required: [id, name, slug]
      properties:
        id: { type: integer, format: int64, example: 1 }
        name: { type: string, example: Makanan Utama }
        slug: { type: string, example: makanan-utama }

    CategoryRef:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int64, example: 2 }
        name: { type: string, example: Lauk }

    RecipeSummary:
      type: object
      required:
        [id, title, description, imageUrl, cookingTimeMinutes, servings, category, isFavorited, ratingAverage, ratingCount, createdAt]
      properties:
        id: { type: integer, format: int64, example: 12 }
        title: { type: string, example: Rendang Sapi }
        description: { type: string, nullable: true }
        imageUrl: { type: string, nullable: true, example: 'https://example.com/rendang.jpg' }
        cookingTimeMinutes: { type: integer, minimum: 1, example: 180 }
        servings: { type: integer, minimum: 1, example: 6 }
        category: { $ref: '#/components/schemas/CategoryRef' }
        isFavorited: { type: boolean }
        ratingAverage:
          type: number
          nullable: true
          description: Rata-rata rating 1-5, dibulatkan satu desimal. `null` jika belum ada ulasan.
          example: 4.5
        ratingCount: { type: integer, minimum: 0, example: 12 }
        createdAt: { type: string, format: date-time }

    RecipeDetail:
      allOf:
        - $ref: '#/components/schemas/RecipeSummary'
        - type: object
          required: [ingredients, instructions, updatedAt]
          properties:
            ingredients:
              type: array
              items: { $ref: '#/components/schemas/Ingredient' }
            instructions:
              type: array
              items: { $ref: '#/components/schemas/Instruction' }
            updatedAt: { type: string, format: date-time }

    Ingredient:
      type: object
      required: [name, quantity, unit]
      properties:
        name: { type: string, example: Daging sapi }
        quantity:
          type: string
          description: Teks, bisa "secukupnya" atau "1/2". Jangan dipaksa menjadi angka.
          example: '1'
        unit: { type: string, nullable: true, example: kg }

    Instruction:
      type: object
      required: [stepNumber, description]
      properties:
        stepNumber: { type: integer, minimum: 1, example: 1 }
        description: { type: string, example: Haluskan bumbu. }

    RecipeRequest:
      type: object
      description: |
        Urutan bahan dan langkah mengikuti urutan array.
        Jangan kirim `stepNumber` atau `sortOrder`.
      required: [title, cookingTimeMinutes, servings, categoryId, ingredients, instructions]
      properties:
        title: { type: string, minLength: 3, maxLength: 150 }
        description: { type: string, nullable: true, maxLength: 2000 }
        imageUrl: { $ref: '#/components/schemas/ImageUrl' }
        cookingTimeMinutes: { type: integer, minimum: 1 }
        servings: { type: integer, minimum: 1 }
        categoryId:
          type: integer
          format: int64
          description: >-
            Harus ada di daftar kategori. Jika tidak, `400 VALIDATION_ERROR` dengan field `categoryId`.
        ingredients:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/IngredientRequest' }
        instructions:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/InstructionRequest' }

    IngredientRequest:
      type: object
      required: [name, quantity]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        quantity: { type: string, minLength: 1, maxLength: 50 }
        unit: { type: string, nullable: true, maxLength: 30 }

    InstructionRequest:
      type: object
      required: [description]
      properties:
        description: { type: string, minLength: 1, maxLength: 2000 }

    RecipePage:
      type: object
      required: [content, page, size, totalElements, totalPages, hasNext]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/RecipeSummary' }
        page: { type: integer, example: 1 }
        size: { type: integer, example: 12 }
        totalElements: { type: integer, format: int64, example: 87 }
        totalPages: { type: integer, example: 8 }
        hasNext: { type: boolean, example: true }

    ImageUrl:
      type: string
      nullable: true
      maxLength: 2048
      description: URL http/https, atau path hasil `POST /images` yang diawali `/api/v1/images/`.
      pattern: '^(https?://|/api/v1/images/)'
      example: /api/v1/images/3f2a9c0d1b7e4a6f8c5d2e1f0a9b8c7d.jpg

    ImageUpload:
      type: object
      required: [url]
      properties:
        url: { type: string, example: /api/v1/images/3f2a9c0d1b7e4a6f8c5d2e1f0a9b8c7d.jpg }

    AuthorRef:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int64, example: 7 }
        name: { type: string, example: Siti }

    Comment:
      type: object
      required: [id, recipeId, parentId, author, content, createdAt, replies]
      properties:
        id: { type: integer, format: int64, example: 31 }
        recipeId: { type: integer, format: int64, example: 12 }
        parentId: { type: integer, format: int64, nullable: true, description: '`null` untuk komentar utama' }
        author: { $ref: '#/components/schemas/AuthorRef' }
        content: { type: string, example: 'Sudah saya coba, enak sekali!' }
        createdAt: { type: string, format: date-time }
        replies:
          type: array
          description: Balasan, terlama lebih dulu. Selalu kosong pada balasan.
          items: { $ref: '#/components/schemas/Comment' }

    CommentRequest:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 1000, description: Di-trim }
        parentId: { type: integer, format: int64, nullable: true }

    CommentPage:
      type: object
      required: [content, page, size, totalElements, totalPages, hasNext, totalComments]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/Comment' }
        page: { type: integer, example: 1 }
        size: { type: integer, example: 12 }
        totalElements: { type: integer, format: int64, description: Jumlah komentar utama }
        totalPages: { type: integer }
        hasNext: { type: boolean }
        totalComments: { type: integer, format: int64, description: Komentar utama beserta balasan }

    Review:
      type: object
      required: [id, rating, content, author, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64, example: 5 }
        rating: { type: integer, minimum: 1, maximum: 5, example: 5 }
        content: { type: string, nullable: true, example: Bumbunya meresap sempurna. }
        author: { $ref: '#/components/schemas/AuthorRef' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    FeaturedReview:
      allOf:
        - $ref: '#/components/schemas/Review'
        - type: object
          required: [recipe]
          properties:
            recipe:
              type: object
              required: [id, title]
              properties:
                id: { type: integer, format: int64, example: 12 }
                title: { type: string, example: Rendang Sapi }

    ReviewRequest:
      type: object
      required: [rating]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        content: { type: string, nullable: true, maxLength: 500, description: 'Di-trim; teks kosong disimpan sebagai `null`' }

    ReviewPage:
      type: object
      required: [content, page, size, totalElements, totalPages, hasNext]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/Review' }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
        hasNext: { type: boolean }

    ArticleCategory:
      type: string
      description: TIPS = Tips dapur, CERITA = Cerita kuliner, BAHAN = Mengenal bahan, TEKNIK = Teknik memasak
      enum: [TIPS, CERITA, BAHAN, TEKNIK]

    ArticleLink:
      type: object
      required: [id, title, coverImageUrl]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        coverImageUrl: { type: string, nullable: true }

    ArticleSummary:
      type: object
      required: [id, title, excerpt, coverImageUrl, category, tags, author, readingTimeMinutes, publishedAt]
      properties:
        id: { type: integer, format: int64, example: 3 }
        title: { type: string, example: Rahasia Santan Tidak Pecah }
        excerpt: { type: string, nullable: true, description: Ringkasan singkat }
        coverImageUrl: { type: string, nullable: true }
        category: { $ref: '#/components/schemas/ArticleCategory' }
        tags:
          type: array
          items: { type: string }
          example: [santan, rendang]
        author: { $ref: '#/components/schemas/AuthorRef' }
        readingTimeMinutes: { type: integer, minimum: 1, description: 'Perkiraan dari jumlah kata, 200 kata per menit' }
        publishedAt: { type: string, format: date-time }

    ArticleDetail:
      allOf:
        - $ref: '#/components/schemas/ArticleSummary'
        - type: object
          required: [content, updatedAt, previous, next]
          properties:
            content:
              type: string
              description: Teks biasa. Paragraf dipisahkan baris kosong; tidak ada HTML atau Markdown.
            updatedAt: { type: string, format: date-time }
            previous:
              description: Artikel yang terbit tepat sebelumnya (lebih lama), atau `null`
              nullable: true
              allOf: [{ $ref: '#/components/schemas/ArticleLink' }]
            next:
              description: Artikel yang terbit tepat sesudahnya (lebih baru), atau `null`
              nullable: true
              allOf: [{ $ref: '#/components/schemas/ArticleLink' }]

    ArticleRequest:
      type: object
      required: [title, content, category]
      properties:
        title: { type: string, minLength: 3, maxLength: 150 }
        excerpt: { type: string, nullable: true, maxLength: 300 }
        content: { type: string, minLength: 1, maxLength: 20000 }
        coverImageUrl: { $ref: '#/components/schemas/ImageUrl' }
        category: { $ref: '#/components/schemas/ArticleCategory' }
        tags:
          type: array
          maxItems: 8
          description: Di-trim dan diubah ke huruf kecil; duplikat dibuang.
          items: { type: string, minLength: 1, maxLength: 30 }

    ArticlePage:
      type: object
      required: [content, page, size, totalElements, totalPages, hasNext]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/ArticleSummary' }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
        hasNext: { type: boolean }

    ArticleFacets:
      type: object
      required: [categories, tags]
      properties:
        categories:
          type: array
          items:
            type: object
            required: [category, count]
            properties:
              category: { $ref: '#/components/schemas/ArticleCategory' }
              count: { type: integer, format: int64 }
        tags:
          type: array
          items:
            type: object
            required: [name, count]
            properties:
              name: { type: string }
              count: { type: integer, format: int64 }
